<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova · Premium Store</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ── Reset & Base ── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f0f2f5;
            color: #1a1a2e;
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #c1c7cd;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0a8b0;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* ── Toast ── */
        .toast-container {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 380px;
            width: 100%;
        }
        .toast {
            background: #1a1a2e;
            color: #fff;
            padding: 14px 20px;
            border-radius: 16px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            display: flex;
            align-items: center;
            gap: 14px;
            animation: slideUpToast 0.4s ease;
            transform-origin: bottom right;
            border-left: 4px solid #2874f0;
        }
        .toast.success {
            border-left-color: #2ecc71;
        }
        .toast i {
            font-size: 1.4rem;
            color: #2ecc71;
        }
        .toast .toast-msg {
            flex: 1;
            font-weight: 500;
            font-size: 0.9rem;
        }
        .toast .toast-close {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.2rem;
            transition: 0.2s;
            padding: 0 4px;
        }
        .toast .toast-close:hover {
            color: #fff;
        }
        @keyframes slideUpToast {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* ── App Bar ── */
        .app-bar {
            background: #2874f0;
            color: #fff;
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 10px 0;
            box-shadow: 0 2px 12px rgba(40, 116, 240, 0.25);
        }
        .app-bar .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand {
            font-weight: 900;
            font-size: 1.8rem;
            letter-spacing: -0.03em;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            text-decoration: none;
            flex-shrink: 0;
        }
        .brand i {
            font-size: 1.6rem;
            color: #fbc531;
        }
        .brand span {
            font-weight: 300;
            color: rgba(255, 255, 255, 0.7);
        }

        .search-wrapper {
            flex: 1 1 320px;
            max-width: 520px;
            position: relative;
        }
        .search-wrapper i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 0.9rem;
        }
        .search-wrapper input {
            width: 100%;
            padding: 10px 16px 10px 44px;
            border-radius: 60px;
            border: none;
            background: #fff;
            font-size: 0.9rem;
            transition: 0.25s;
            color: #1a1a2e;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
        }
        .search-wrapper input::placeholder {
            color: #94a3b8;
            font-weight: 400;
        }
        .search-wrapper input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.3), 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .app-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .app-actions button {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .app-actions button:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: scale(1.04);
        }
        .app-actions .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #fbc531;
            color: #1a1a2e;
            font-size: 0.6rem;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 30px;
            min-width: 20px;
            text-align: center;
            border: 2px solid #2874f0;
        }
        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.18);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            border: 2px solid rgba(255, 255, 255, 0.25);
            transition: 0.2s;
            flex-shrink: 0;
        }
        .avatar:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: rgba(255, 255, 255, 0.5);
        }

        /* ── Category Nav ── */
        .category-nav {
            background: #fff;
            border-bottom: 1px solid #e8ecf0;
            padding: 8px 0;
            position: sticky;
            top: 66px;
            z-index: 90;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.02);
        }
        .category-nav .container {
            display: flex;
            flex-wrap: nowrap;
            gap: 6px;
            overflow-x: auto;
            padding: 4px 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .category-nav .container::-webkit-scrollbar {
            display: none;
        }
        .cat-btn {
            background: transparent;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
            color: #4a4a5a;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .cat-btn i {
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .cat-btn:hover {
            background: #f0f2f5;
            color: #2874f0;
        }
        .cat-btn:hover i {
            color: #2874f0;
        }
        .cat-btn.active {
            background: #2874f0;
            color: #fff;
            box-shadow: 0 4px 12px rgba(40, 116, 240, 0.25);
        }
        .cat-btn.active i {
            color: #fff;
        }

        /* ── Hero Banner ── */
        .hero {
            background: linear-gradient(145deg, #ffffff, #f8faff);
            border-radius: 28px;
            padding: 44px 40px;
            margin: 24px 0 28px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -60%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(40, 116, 240, 0.04) 0%, transparent 70%);
            pointer-events: none;
        }
        .hero-text {
            flex: 1 1 260px;
            position: relative;
            z-index: 1;
        }
        .hero-text .tag {
            background: #2874f0;
            color: #fff;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 16px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            display: inline-block;
            margin-bottom: 14px;
        }
        .hero-text h1 {
            font-size: 2.6rem;
            font-weight: 900;
            line-height: 1.08;
            letter-spacing: -0.03em;
            color: #1a1a2e;
        }
        .hero-text h1 span {
            background: linear-gradient(135deg, #2874f0, #1a5fc7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .hero-text p {
            color: #5a5a72;
            margin: 12px 0 22px;
            max-width: 420px;
            font-size: 1.05rem;
        }
        .btn-primary {
            background: #fbc531;
            color: #1a1a2e;
            border: none;
            padding: 14px 36px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 8px 24px rgba(251, 197, 49, 0.3);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 32px rgba(251, 197, 49, 0.4);
            background: #fbc531;
        }
        .hero-image {
            flex: 1 1 180px;
            text-align: center;
            font-size: 4rem;
            color: #1a1a2e;
            position: relative;
            z-index: 1;
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .hero-image i {
            background: #fff;
            padding: 18px;
            border-radius: 60px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.04);
            font-size: 2.2rem;
            transition: 0.3s;
            border: 1px solid rgba(226, 232, 240, 0.5);
        }
        .hero-image i:hover {
            transform: translateY(-6px) scale(1.04);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.06);
        }

        /* ── Section Header ── */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .section-header h2 {
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            color: #1a1a2e;
        }
        .section-header h2 i {
            color: #2874f0;
            margin-right: 8px;
        }
        .product-count {
            font-weight: 500;
            color: #6a6a82;
            font-size: 0.85rem;
            background: #f0f2f5;
            padding: 4px 16px;
            border-radius: 40px;
        }

        /* ── Product Grid ── */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 48px;
        }
        .product-card {
            background: #fff;
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid #e8ecf0;
            transition: 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            cursor: pointer;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 48px -12px rgba(0, 0, 0, 0.12);
            border-color: transparent;
        }
        .product-card .product-img {
            padding: 28px 0 12px;
            text-align: center;
            font-size: 3.6rem;
            color: #1a1a2e;
            background: #f8faff;
            position: relative;
            transition: 0.3s;
        }
        .product-card:hover .product-img {
            background: #f0f5ff;
        }
        .product-card .product-img i {
            transition: 0.4s;
            display: inline-block;
        }
        .product-card:hover .product-img i {
            transform: scale(1.06) rotate(-2deg);
        }
        .product-card .product-body {
            padding: 12px 18px 20px;
        }
        .product-card .product-title {
            font-weight: 700;
            font-size: 1rem;
            color: #1a1a2e;
            line-height: 1.3;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .product-card .product-category {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #6a6a82;
            letter-spacing: 0.4px;
            font-weight: 600;
            margin-top: 2px;
        }
        .product-card .product-rating {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 6px 0 10px;
            color: #f59e0b;
            font-size: 0.85rem;
        }
        .product-card .product-rating span {
            color: #6a6a82;
            font-size: 0.75rem;
            font-weight: 500;
        }
        .product-card .product-price {
            font-weight: 800;
            font-size: 1.25rem;
            color: #1a1a2e;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .product-card .product-price .old {
            font-size: 0.8rem;
            font-weight: 400;
            color: #94a3b8;
            text-decoration: line-through;
        }
        .product-card .product-price .discount {
            font-size: 0.7rem;
            font-weight: 700;
            color: #2ecc71;
            background: #e8f8ef;
            padding: 2px 10px;
            border-radius: 30px;
        }
        .product-card .add-btn {
            width: 100%;
            margin-top: 14px;
            padding: 10px;
            border: none;
            border-radius: 60px;
            background: #f0f2f5;
            font-weight: 700;
            font-size: 0.85rem;
            color: #1a1a2e;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .product-card .add-btn:hover {
            background: #2874f0;
            color: #fff;
            box-shadow: 0 4px 16px rgba(40, 116, 240, 0.25);
        }
        .product-card .add-btn.added {
            background: #2ecc71;
            color: #fff;
        }

        /* ── Modals ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: none;
            justify-content: center;
            align-items: center;
            animation: fadeIn 0.25s ease;
            padding: 20px;
        }
        .modal-overlay.active {
            display: flex;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        .modal-content {
            background: #fff;
            border-radius: 32px;
            max-width: 560px;
            width: 100%;
            padding: 32px 36px;
            max-height: 90vh;
            overflow-y: auto;
            animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
            box-shadow: 0 32px 64px rgba(0, 0, 0, 0.18);
        }
        @keyframes slideUp {
            from {
                transform: translateY(30px) scale(0.96);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: #f0f2f5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            color: #4a4a5a;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover {
            background: #e8ecf0;
            color: #1a1a2e;
            transform: rotate(90deg);
        }

        .modal-product-img {
            text-align: center;
            font-size: 5rem;
            padding: 8px 0 4px;
            color: #1a1a2e;
        }
        .modal-product-title {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            margin-top: 4px;
        }
        .modal-product-desc {
            color: #5a5a72;
            margin: 8px 0 16px;
            font-size: 0.95rem;
            line-height: 1.6;
        }
        .modal-product-price {
            font-size: 1.7rem;
            font-weight: 800;
            color: #1a1a2e;
        }
        .modal-product-price .old {
            font-size: 1rem;
            text-decoration: line-through;
            color: #94a3b8;
            margin-left: 10px;
            font-weight: 400;
        }
        .modal-add-btn {
            width: 100%;
            padding: 14px;
            background: #2874f0;
            color: #fff;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 6px 20px rgba(40, 116, 240, 0.25);
        }
        .modal-add-btn:hover {
            background: #1a5fc7;
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(40, 116, 240, 0.3);
        }
        .modal-add-btn.added {
            background: #2ecc71;
        }

        /* ── Checkout Modal ── */
        .checkout-modal .modal-content {
            max-width: 480px;
        }
        .checkout-form label {
            display: block;
            font-weight: 600;
            margin: 14px 0 4px;
            font-size: 0.85rem;
            color: #1a1a2e;
        }
        .checkout-form input,
        .checkout-form select {
            width: 100%;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid #e8ecf0;
            font-size: 0.95rem;
            transition: 0.2s;
            background: #fafbfc;
        }
        .checkout-form input:focus,
        .checkout-form select:focus {
            outline: none;
            border-color: #2874f0;
            box-shadow: 0 0 0 4px rgba(40, 116, 240, 0.08);
            background: #fff;
        }
        .place-order-btn {
            width: 100%;
            padding: 14px;
            margin-top: 22px;
            background: #fbc531;
            color: #1a1a2e;
            border: none;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.25s;
            box-shadow: 0 6px 20px rgba(251, 197, 49, 0.25);
        }
        .place-order-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(251, 197, 49, 0.35);
        }

        /* ── Cart Sidebar ── */
        .cart-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            display: none;
            justify-content: flex-end;
        }
        .cart-overlay.active {
            display: flex;
        }
        .cart-panel {
            width: 420px;
            max-width: 92vw;
            background: #fff;
            height: 100vh;
            padding: 28px 24px 24px;
            display: flex;
            flex-direction: column;
            animation: slideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: -8px 0 48px rgba(0, 0, 0, 0.06);
        }
        @keyframes slideIn {
            from {
                transform: translateX(100%);
            }
            to {
                transform: translateX(0);
            }
        }
        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #e8ecf0;
            padding-bottom: 16px;
        }
        .cart-header h3 {
            font-weight: 800;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            gap: 10px;
            color: #1a1a2e;
        }
        .cart-header h3 i {
            color: #2874f0;
        }
        .close-cart {
            background: #f0f2f5;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 1.4rem;
            cursor: pointer;
            color: #4a4a5a;
            transition: 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .close-cart:hover {
            background: #e8ecf0;
            color: #1a1a2e;
        }
        .cart-items {
            flex: 1;
            overflow-y: auto;
            margin: 16px 0 12px;
            padding-right: 4px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid #f0f2f5;
            animation: fadeIn 0.3s ease;
        }
        .cart-item-icon {
            font-size: 2rem;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8faff;
            border-radius: 14px;
            color: #1a1a2e;
            flex-shrink: 0;
        }
        .cart-item-info {
            flex: 1;
            min-width: 0;
        }
        .cart-item-name {
            font-weight: 600;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .cart-item-price {
            font-weight: 700;
            color: #1a1a2e;
            font-size: 0.95rem;
        }
        .cart-item-qty {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }
        .cart-item-qty button {
            width: 30px;
            height: 30px;
            border-radius: 30px;
            border: 1.5px solid #e8ecf0;
            background: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;

<body>

    <!-- ── Category Nav ── -->
    <nav class="category-nav" id="categoryNav">
        <div class="container" id="filterContainer">
            <button class="cat-btn active" data-category="all"><i class="fas fa-th-large"></i> All</button>

    </nav>

    <!-- ── Main ── -->

                <button class="btn-primary" onclick="document.getElementById('productSection').scrollIntoView({behavior:'smooth'})">
                    <i class="fas fa-rocket"></i> Explore Now
                </button>
            </div>
            <div class="hero-image">
                <i class="fas fa-headphones"></i>
                <i class="fas fa-laptop"></i>

        <!-- Product Section -->
        <section id="productSection">

    <!-- ── Product Detail Modal ── -->
    <div class="modal-overlay" id="productModal">
        <div class="modal-content">

            <div class="modal-product-title" id="modalTitle"></div>
            <div class="modal-product-desc" id="modalDesc"></div>
            <div class="modal-product-price" id="modalPrice"></div>
            <div style="margin:6px 0 2px; color:#f59e0b; font-size:0.95rem;" id="modalRating"></div>
            <button class="modal-add-btn" id="modalAddBtn"><i class="fas fa-plus-circle"></i> Add to Cart</button>
        </div>
    </div>

    <!-- ── Checkout Modal ── -->
    <div class="modal-overlay checkout-modal" id="checkoutModal">
        <div class="modal-content">
            <button class="modal-close" id="checkoutClose">&times;</button>
            <h2 style="font-weight:800; margin-bottom:4px; font-size:1.5rem;">Checkout</h2>
            <p style="color:#5a5a72; margin-bottom:12px; font-size:0.9rem;">Complete your order securely</p>
            <form class="checkout-form" id="checkoutForm">
                <label>Full Name</label>
                <input type="text" placeholder="John Doe" required />
                <label>Email Address</label>
                <input type="email" placeholder="john@example.com" required />

                <label>Payment Method</label>
                <select>
                    <option>Credit Card</option>
                    <option>PayPal</option>

            </form>

    <!-- ── Cart Sidebar ── -->
    <div class="cart-overlay" id="cartOverlay">
        <div class="cart-panel">
            <div class="cart-header">
                <h3><i class="fas fa-shopping-bag"></i> Your Cart</h3>
                <button class="close-cart" id="closeCart">&times;</button>
            </div>
            <div class="cart-items" id="cartItemsContainer"></div>
            <div class="cart-footer">
                <div class="cart-total"><span>Total</span><span id="cartTotal">$0.00</span></div>
                <button class="checkout-btn" id="checkoutBtn" disabled>Proceed to Checkout</button>
                <button class="clear-cart" id="clearCart">Clear Cart</button>
            </div>
        </div>
    </div>

    <script>
        // ── PRODUCT DATA ──
        const products = [{
            id: 1,
            name: 'Studio Wireless Pro',
            category: 'Audio',
            price: 149,
            originalPrice: 199,
            rating: 4.8,
            reviews: 124,
            icon: 'fa-headphones',
            desc: 'Premium noise‑cancelling headphones with 40h battery life, spatial audio, and ultra‑comfortable ear cups.'
        }, {
            id: 2,
            name: 'UltraBook 16"',
            category: 'Computers',
            price: 1299,
            originalPrice: 1499,
            rating: 4.9,
            reviews: 89,
            icon: 'fa-laptop',
            desc: 'Lightweight powerhouse with 16GB RAM, 512GB SSD, stunning 4K display, and all‑day battery life.'
        }, {
            id: 3,
            name: 'Mirrorless V Camera',
            category: 'Photography',
            price: 899,
            originalPrice: 1050,
            rating: 4.7,
            reviews: 56,
            icon: 'fa-camera',
            desc: '24MP mirrorless camera with 4K video, image stabilization, and professional‑grade autofocus.'
        }, {
            id: 4,
            name: 'Smart Chrono Watch',
            category: 'Wearables',
            price: 249,
            originalPrice: 299,
            rating: 4.6,
            reviews: 203,
            icon: 'fa-watch',
            desc: 'GPS, heart rate monitor, sleep tracking, and 7‑day battery life in a sleek titanium design.'
        }, {
            id: 5,
            name: 'Ceramic Art Mug',
            category: 'Lifestyle',
            price: 19,
            originalPrice: 29,
            rating: 5.0,
            reviews: 312,
            icon: 'fa-mug-hot',
            desc: 'Handcrafted ceramic mug with a unique glaze, microwave and dishwasher safe.'
        }, {
            id: 6,
            name: 'Ergonomic Mesh Chair',
            category: 'Furniture',
            price: 399,
            originalPrice: 490,
            rating: 4.8,
            reviews: 78,
            icon: 'fa-chair',
            desc: 'Adjustable office chair with lumbar support, breathable mesh back, and premium cushioning.'
        }, {
            id: 7,
            name: 'Noise Cancelling Earbuds',
            category: 'Audio',
            price: 79,
            originalPrice: 99,
            rating: 4.5,
            reviews: 215,
            icon: 'fa-earbuds',
            desc: 'True wireless earbuds with active noise cancellation, IPX5 waterproofing, and crystal‑clear calls.'
        }, {
            id: 8,
            name: '4K Action Camera',
            category: 'Photography',
            price: 329,
            originalPrice: 399,
            rating: 4.4,
            reviews: 134,
            icon: 'fa-video',
            desc: 'Waterproof action camera with 4K/60fps, image stabilization, and dual‑screen for vlogging.'
        }];

        // ── STATE ──
        let cart = JSON.parse(localStorage.getItem('novaCart')) || [];
        let currentCategory = 'all';
        let currentSearch = '';
        let selectedProductId = null;

        // ── DOM REFS ──
        const grid = document.getElementById('productsGrid');
        const filterBtns = document.querySelectorAll('.cat-btn');
        const searchInput = document.getElementById('searchInput');
        const cartBadge = document.getElementById('cartBadge');
        const cartItemsContainer = document.getElementById('cartItemsContainer');
        const cartTotal = document.getElementById('cartTotal');
        const cartOverlay = document.getElementById('cartOverlay');
        const productModal = document.getElementById('productModal');
        const checkoutModal = document.getElementById('checkoutModal');
        const productCount = document.getElementById('productCount');
        const checkoutBtn = document.getElementById('checkoutBtn');
        const toastContainer = document.getElementById('toastContainer');

        // ── HELPERS ──
        function getFilteredProducts() {
            return products.filter(p => {
                const matchCategory = currentCategory === 'all' || p.category === currentCategory;
                const matchSearch = p.name.toLowerCase().includes(currentSearch.toLowerCase()) ||
                    p.category.toLowerCase().includes(currentSearch.toLowerCase());
                return matchCategory && matchSearch;
            });
        }

        function renderStars(rating) {
            const full = Math.floor(rating);
            const half = rating % 1 !== 0 ? '☆' : '';
            return '★'.repeat(full) + half;
        }

        function getDiscount(original, current) {
            if (!original || original <= current) return null;
            return Math.round(((original - current) / original) * 100);
        }

        // ── TOAST ──
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <i class="fas fa-${type === 'success' ? 'check-circle' : 'info-circle'}"></i>
                <span class="toast-msg">${message}</span>
                <button class="toast-close">&times;</button>
            `;
            toast.querySelector('.toast-close').addEventListener('click', () => {
                toast.remove();
            });
            toastContainer.appendChild(toast);
            setTimeout(() => {
                if (toast.parentNode) toast.remove();
            }, 4000);
        }

        // ── RENDER PRODUCTS ──
        function renderProducts() {
            const filtered = getFilteredProducts();
            productCount.textContent = filtered.length + ' product' + (filtered.length !== 1 ? 's' : '');
            if (filtered.length === 0) {
                grid.innerHTML =
                    `<div style="grid-column:1/-1; text-align:center; padding:80px 0; color:#94a3b8;">
                        <i class="fas fa-search" style="font-size:3rem; display:block; margin-bottom:16px; color:#d0d5dd;"></i>
                        <p style="font-weight:500; font-size:1.1rem;">No products found</p>
                        <p style="font-size:0.9rem; margin-top:4px;">Try adjusting your search or filter</p>
                    </div>`;
                return;
            }
            grid.innerHTML = filtered.map(p => {
                const disc = getDiscount(p.originalPrice, p.price);
                return `
                    <div class="product-card" data-id="${p.id}">
                        <div class="product-img"><i class="fas ${p.icon}"></i></div>
                        <div class="product-body">
                            <div class="product-title">${p.name}</div>
                            <div class="product-category">${p.category}</div>
                            <div class="product-rating">${renderStars(p.rating)} <span>(${p.reviews})</span></div>
                            <div class="product-price">
                                $${p.price}
                                ${p.originalPrice ? `<span class="old">$${p.originalPrice}</span>` : ''}
                                ${disc ? `<span class="discount">${disc}% OFF</span>` : ''}
                            </div>
                            <button class="add-btn" data-id="${p.id}"><i class="fas fa-plus-circle"></i> Add</button>
                        </div>
                    </div>
                `;
            }).join('');

            // Add button listeners
            document.querySelectorAll('.add-btn').forEach(btn => {
                btn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    addToCart(id, this);
                });
            });

            // Click card to open modal
            document.querySelectorAll('.product-card').forEach(card => {
                card.addEventListener('click', function() {
                    const id = parseInt(this.dataset.id);
                    openProductModal(id);
                });
            });
        }

        // ── ADD TO CART ──
        function addToCart(id, btnElement) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            const existing = cart.find(item => item.id === id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...p, quantity: 1 });
            }
            saveCart();
            renderCart();
            // Visual feedback
            if (btnElement) {
                const originalHtml = btnElement.innerHTML;
                btnElement.innerHTML = '<i class="fas fa-check"></i> Added';
                btnElement.classList.add('added');
                setTimeout(() => {
                    btnElement.innerHTML = originalHtml;
                    btnElement.classList.remove('added');
                }, 800);
            }
            showToast(`${p.name} added to cart`, 'success');
        }

        // ── PRODUCT MODAL ──
        function openProductModal(id) {
            const p = products.find(prod => prod.id === id);
            if (!p) return;
            selectedProductId = id;
            document.getElementById('modalIcon').className = 'fas ' + p.icon;
            document.getElementById('modalTitle').textContent = p.name;
            document.getElementById('modalDesc').textContent = p.desc;
            const disc = getDiscount(p.originalPrice, p.price);
            document.getElementById('modalPrice').innerHTML =
                `$${p.price}${p.originalPrice ? `<span class="old">$${p.originalPrice}</span>` : ''}${disc ? ` <span style="font-size:0.9rem;color:#2ecc71;font-weight:700;">${disc}% OFF</span>` : ''}`;
            document.getElementById('modalRating').textContent = renderStars(p.rating) + ' (' + p.reviews + ' reviews)';
            productModal.classList.add('active');
            document.getElementById('modalAddBtn').textContent = ' Add to Cart';
            document.getElementById('modalAddBtn').innerHTML = '<i class="fas fa-plus-circle"></i> Add to Cart';
            document.getElementById('modalAddBtn').classList.remove('added');
        }

        document.getElementById('modalClose').addEventListener('click', () => productModal.classList.remove('active'));
        productModal.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        document.getElementById('modalAddBtn').addEventListener('click', function() {
            const p = products.find(prod => prod.id === selectedProductId);
            if (!p) return;
            const existing = cart.find(item => item.id === p.id);
            if (existing) {
                existing.quantity++;
            } else {
                cart.push({ ...p, quantity: 1 });
            }
            saveCart();
            renderCart();
            productModal.classList.remove('active');
            this.innerHTML = '<i class="fas fa-check"></i> Added!';
            this.classList.add('added');
            setTimeout(() => {
                this.innerHTML = '<i class="fas fa-plus-circle"></i> Add to Cart';
                this.classList.remove('added');
            }, 800);
            showToast(`${p.name} added to cart`, 'success');
        });

        // ── CART ──
        function saveCart() {
            localStorage.setItem('novaCart', JSON.stringify(cart));
            updateBadge();
        }

        function updateBadge() {
            const count = cart.reduce((sum, item) => sum + item.quantity, 0);
            cartBadge.textContent = count;
            checkoutBtn.disabled = cart.length === 0;
        }

        function renderCart() {
            if (cart.length === 0) {
                cartItemsContainer.innerHTML =
                    `<div class="cart-empty"><i class="fas fa-shopping-bag"></i><p>Your cart is empty</p><p style="font-size:0.85rem;color:#b0b8c4;">Add some products to get started</p></div>`;
                cartTotal.textContent = '$0.00';
                updateBadge();
                return;
            }
            let html = '',
                total = 0;
            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                html += `
                    <div class="cart-item">
                        <div class="cart-item-icon"><i class="fas ${item.icon}"></i></div>
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.name}</div>
                            <div class="cart-item-price">$${item.price}</div>
                        </div>
                        <div class="cart-item-qty">
                            <button class="qty-dec" data-id="${item.id}">−</button>
                            <span>${item.quantity}</span>
                            <button class="qty-inc" data-id="${item.id}">+</button>
                        </div>
                        <button class="cart-item-remove" data-id="${item.id}"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
            });
            cartItemsContainer.innerHTML = html;
            cartTotal.textContent = '$' + total.toFixed(2);
            updateBadge();

            // attach events
            cartItemsContainer.querySelectorAll('.qty-inc').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(i => i.id === id);
                    if (item) { item.quantity++;
                        saveCart();
                        renderCart(); }
                };
            });
            cartItemsContainer.querySelectorAll('.qty-dec').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(i => i.id === id);
                    if (item) {
                        item.quantity--;
                        if (item.quantity <= 0) cart = cart.filter(i => i.id !== id);
                        saveCart();
                        renderCart();
                    }
                };
            });
            cartItemsContainer.querySelectorAll('.cart-item-remove').forEach(btn => {
                btn.onclick = function(e) {
                    e.stopPropagation();
                    const id = parseInt(this.dataset.id);
                    const item = cart.find(i => i.id === id);
                    cart = cart.filter(i => i.id !== id);
                    saveCart();
                    renderCart();
                    if (item) showToast(`${item.name} removed`, 'success');
                };
            });
        }

        // ── CART OVERLAY ──
        document.getElementById('cartIcon').addEventListener('click', function() {
            cartOverlay.classList.add('active');
            document.body.style.overflow = 'hidden';
            renderCart();
        });
        document.getElementById('closeCart').addEventListener('click', () => {
            cartOverlay.classList.remove('active');
            document.body.style.overflow = '';
        });
        cartOverlay.addEventListener('click', function(e) {
            if (e.target === this) {
                this.classList.remove('active');
                document.body.style.overflow = '';
            }
        });

        // ── CHECKOUT ──
        document.getElementById('checkoutBtn').addEventListener('click', function() {
            if (cart.length === 0) return;
            cartOverlay.classList.remove('active');
            document.body.style.overflow = '';
            checkoutModal.classList.add('active');
        });
        document.getElementById('checkoutClose').addEventListener('click', () => checkoutModal.classList.remove('active'));
        checkoutModal.addEventListener('click', function(e) {
            if (e.target === this) this.classList.remove('active');
        });

        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);
            showToast(`🎉 Order placed! Total: $${total.toFixed(2)}`, 'success');
            cart = [];
            saveCart();
            renderCart();
            checkoutModal.classList.remove('active');
            this.reset();
        });

        document.getElementById('clearCart').addEventListener('click', function() {
            if (cart.length === 0) return;
            if (confirm('Clear all items from your cart?')) {
                cart = [];
                saveCart();
                renderCart();
                showToast('Cart cleared', 'success');
            }
        });

        // ── FILTERS ──
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCategory = this.dataset.category;
                renderProducts();
                // Scroll to products
                document.getElementById('productSection').scrollIntoView({ behavior: 'smooth', block: 'start' });
            });
        });

        // ── SEARCH ──
        searchInput.addEventListener('input', function() {
            currentSearch = this.value.trim();
            renderProducts();
        });

        // ── KEYBOARD SHORTCUT ──
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (productModal.classList.contains('active')) productModal.classList.remove('active');
                if (checkoutModal.classList.contains('active')) checkoutModal.classList.remove('active');
                if (cartOverlay.classList.contains('active')) {
                    cartOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                searchInput.focus();
            }
        });

        // ── INIT ──
        renderProducts();
        updateBadge();
        renderCart();

        console.log('🚀 Nova Store ready — Ctrl+K to search');
    </script>
</body>
</html>
